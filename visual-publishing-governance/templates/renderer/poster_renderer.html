<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, height=1920, initial-scale=1.0">
  <title>{{PROJECT_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CSS Variables & Design Tokens (7 Core Category Themes)
       ========================================================================== */
    :root {
      --canvas-w: 1440px;
      --canvas-h: 1920px;

      /* Default Theme: Tech Indigo */
      --bg-base: #060b17;
      --bg-card: rgba(15, 23, 42, 0.72);
      --bg-card-hover: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #3182ce;
      --accent-light: #63b3ed;
      --accent-glow: rgba(49, 130, 206, 0.35);
      --accent-secondary: #00f0ff;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(49, 130, 206, 0.4);
      --glow-spot-1: radial-gradient(circle at 85% 65%, rgba(49, 130, 206, 0.28), transparent 55%);
      --glow-spot-2: radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.18), transparent 45%);
    }

    [data-theme="cyber-dark"] {
      --bg-base: #07090e;
      --bg-card: rgba(18, 22, 31, 0.8);
      --text-main: #f0f6fc;
      --text-sub: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #805ad5;
      --accent-light: #b794f4;
      --accent-glow: rgba(128, 90, 213, 0.4);
      --accent-secondary: #38a169;
      --border-card: rgba(255, 255, 255, 0.1);
      --border-accent: rgba(128, 90, 213, 0.45);
      --glow-spot-1: radial-gradient(circle at 80% 60%, rgba(128, 90, 213, 0.3), transparent 55%);
      --glow-spot-2: radial-gradient(circle at 20% 25%, rgba(56, 161, 105, 0.2), transparent 45%);
    }

    [data-theme="obsidian-gold"] {
      --bg-base: #050608;
      --bg-card: rgba(20, 22, 28, 0.82);
      --text-main: #ffffff;
      --text-sub: #e2e8f0;
      --text-muted: #a0aec0;
      --accent: #f59e0b;
      --accent-light: #fcd34d;
      --accent-glow: rgba(245, 158, 11, 0.45);
      --accent-secondary: #00f0ff;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(245, 158, 11, 0.5);
      --glow-spot-1: radial-gradient(circle at 85% 65%, rgba(245, 158, 11, 0.28), transparent 55%);
      --glow-spot-2: radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.1), transparent 40%);
    }

    [data-theme="slate-navy"] {
      --bg-base: #0a0f1d;
      --bg-card: rgba(30, 41, 59, 0.78);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-light: #60a5fa;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --accent-secondary: #f59e0b;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(37, 99, 235, 0.45);
      --glow-spot-1: radial-gradient(circle at 80% 60%, rgba(37, 99, 235, 0.3), transparent 50%);
      --glow-spot-2: radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.15), transparent 45%);
    }

    [data-theme="avant-violet"] {
      --bg-base: #0d0c14;
      --bg-card: rgba(24, 24, 34, 0.8);
      --text-main: #fafafa;
      --text-sub: #e4e4e7;
      --text-muted: #a1a1aa;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.4);
      --accent-secondary: #06b6d4;
      --border-card: rgba(255, 255, 255, 0.14);
      --border-accent: rgba(124, 58, 237, 0.45);
      --glow-spot-1: radial-gradient(circle at 85% 65%, rgba(124, 58, 237, 0.32), transparent 55%);
      --glow-spot-2: radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.2), transparent 45%);
    }

    [data-theme="academic-forest"] {
      --bg-base: #07120c;
      --bg-card: rgba(18, 36, 26, 0.82);
      --text-main: #f7fee7;
      --text-sub: #dcfce7;
      --text-muted: #86efac;
      --accent: #10b981;
      --accent-light: #6ee7b7;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --accent-secondary: #f97316;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-accent: rgba(16, 185, 129, 0.45);
      --glow-spot-1: radial-gradient(circle at 80% 60%, rgba(16, 185, 129, 0.3), transparent 55%);
      --glow-spot-2: radial-gradient(circle at 20% 20%, rgba(249, 115, 22, 0.18), transparent 45%);
    }

    /* ==========================================================================
       Base Reset & Canvas Layout
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: var(--canvas-w);
      height: var(--canvas-h);
      background-color: var(--bg-base);
      background-image: var(--glow-spot-1), var(--glow-spot-2);
      color: var(--text-main);
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 110px 90px 110px;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Subtle Architectural Grid Lines Overlay */
    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }

    .canvas-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    /* ==========================================================================
       Header Components: Category Badge & Giant Display Headline
       ========================================================================== */
    .header-group {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .badge-bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 9999px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      box-shadow: 0 4px 20px var(--accent-glow);
      backdrop-filter: blur(16px);
    }

    .badge-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-light);
    }

    .release-tag {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .display-title {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--text-main);
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .display-title span.highlight {
      background: linear-gradient(135deg, var(--text-main) 30%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .display-subtitle {
      font-size: 34px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-sub);
      max-width: 1100px;
    }

    /* ==========================================================================
       Hero Illustration & Glassmorphism Centerpiece
       ========================================================================== */
    .hero-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      margin: 30px 0;
    }

    .hero-img {
      max-width: 960px;
      max-height: 900px;
      object-fit: contain;
      filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6));
      animation: float 6s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }

    /* ==========================================================================
       Content Card Variations (Matrix & Workflow Layouts)
       ========================================================================== */
    .cards-grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      flex: 1;
      margin: 40px 0;
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 32px;
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }

    .card-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-light);
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 40px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-sub);
    }

    /* ==========================================================================
       Footer Component: Author Identity, Brand Bar & QR Code Slot
       ========================================================================== */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 36px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 2;
    }

    .author-identity {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .avatar-wrapper {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--border-accent), var(--border-card));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .author-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .author-name {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .author-desc {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .brand-signature {
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: right;
    }

    .brand-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    .qr-box {
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    .qr-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body data-theme="{{THEME_SLUG}}">
  <div class="canvas-content">

    <!-- Header Section -->
    <header class="header-group">
      <div class="badge-bar">
        <div class="category-badge">
          <div class="badge-dot"></div>
          <span>{{CATEGORY_NAME}}</span>
        </div>
        <span class="release-tag">{{RELEASE_TAG}}</span>
      </div>

      <h1 class="display-title">{{TITLE_PREFIX}}<span class="highlight">{{TITLE_HIGHLIGHT}}</span></h1>
      <p class="display-subtitle">{{SUBTITLE}}</p>
    </header>

    <!-- Centerpiece Hero Illustration / Mockup -->
    <main class="hero-container">
      <img class="hero-img" src="{{HERO_ILLUSTRATION_PATH}}" alt="Hero Illustration">
    </main>

    <!-- Footer Identity Bar -->
    <footer class="footer-bar">
      <div class="author-identity">
        <div class="avatar-wrapper">
          <img class="avatar-img" src="{{AVATAR_IMAGE_PATH}}" alt="Author Avatar">
        </div>
        <div class="author-meta">
          <div class="author-name">{{AUTHOR_DISPLAY_NAME}}</div>
          <div class="author-desc">{{AUTHOR_TAGLINE}}</div>
        </div>
      </div>

      <div class="brand-signature">
        <div class="brand-text">aooby.cn<br><span style="color:var(--text-muted); font-size:18px; font-weight:500;">全生态自进化治理体系</span></div>
        <div class="qr-box">
          <img class="qr-img" src="{{QR_CODE_PATH}}" alt="Official QR Code">
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
